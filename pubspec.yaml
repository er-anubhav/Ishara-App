  mqtt_client: ^10.0.0
  flutter_blue_plus: ^1.31.0
  http: ^1.1.0
  
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_icons:
