  html: ^0.15.0
  flutter_widget_from_html: ^0.17.1
  camera: ^0.11.3
  image_cropper: ^11.0.0
  opencv_4: ^1.0.0
  path_provider: ^2.0.11
  share_plus: ^12.0.1
